spring.application.name=user-registration-api

# In-memory H2-databas - noll installation for eleverna
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2-konsolen ar aktiverad sa ni kan inspektera databasen i webblasaren
# medan appen kors: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:userdb)
spring.h2.console.enabled=true
