name: Build och testa

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Bygg projekt
        run: ./mvnw -B clean compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper Körbar
        run: chmod +x ./mvnw

      - name: Kör tester
        run: ./mvnw -B test