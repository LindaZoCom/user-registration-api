name: CI - user-registration-api

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testa med Java 21
    runs-on: ubuntu-latest

    steps:
     - name: Hämta koden
       uses: actions/checkout@v4

     - name: Sätt upp Java 21
       uses: actions/setup-java@v5
       with:
         distribution: temurin
         java-version: '21'
         cache: maven

     - name: Gör Maven Wrapper körbar
       run: chmod +x ./mvnw

     - name: Kör tester
       run: ./mvnw -B test