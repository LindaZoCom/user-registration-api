name: Skyddad simulerad deploy

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Kör tester
        run: ./mvnw -B test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy till produktion
        run: echo "Deployar user-registration-api till produktion"
