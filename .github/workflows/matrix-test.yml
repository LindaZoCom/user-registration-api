name: Testa på flera Ubuntu-runners

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]

    steps:
     - name: Hämta koden
       uses: actions/checkout@v4

     - name: Sätt upp Java 21
       uses: actions/setup-java@v5
       with:
        java-version: '21'
        distribution: 'temurin'

     - name: Gör Maven wrapper körbar
       run: chmod +x ./mvnw

     - name: Kör tester på ${{ matrix.runner }}
       run: ./mvnw -B test

     - name: Ladda upp Surefire-rapporter
       if: always()
       uses: actions/upload-artifact@v4
       with:
        name: surefire-reports-${{ matrix.runner }}
        path: target/surefire-reports/
        if-no-files-found: warn