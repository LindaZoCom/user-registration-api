name: Maven test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Rum tests with Maven Wrapper
        run: ./mvnw test
