name: CI/CD - user-registration-api

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Bygg JAR
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Gör Maven wrapper körbar
        run: chmod +x ./mvnw

      - name: Bygg applikationen utan att köra tester igen
        run: ./mvnw -B -DskipTests clean package

      - name: Ladda upp byggresultat
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-api-jar
          path: target/user-registration-api-*.jar
          if-no-files-found: error

  test:
    name: Kör automatiska tester
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Kör tester
        run: ./mvnw -B test

      - name: Ladda upp Surefire-rappaorter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: warn

  deploy:
    name: Simulerad deploy till staging
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name=='push'&&github.ref=='refs/heads/main'
    environment: staging

    steps:
      - name: Hämta byggresultatet
        uses: actions/download-artifact@v4
        with:
          name: user-registration-api-jar
          path: deploy

      - name: Visa vad som skulle deployas
        run: |
          echo "Alla tester är godkända på main"
          echo "Simulerar deploy till staging"
          ls -lh deploy
          echo "En verklig deploy skulle använda miljöns säkra credentials"
    


